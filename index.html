<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lecture Hub APK</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding-bottom: 70px; -webkit-tap-highlight-color: transparent; }
    header { background: #1e293b; padding: 16px 20px; text-align: center; border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 100; }
    header h1 { font-size: 1.25rem; font-weight: 700; color: #38bdf8; }

    .tabs-bar { display: flex; align-items: center; background: #1e293b; padding: 10px; gap: 8px; overflow-x: auto; border-bottom: 1px solid #334155; }
    .tab-btn { background: #334155; color: #94a3b8; border: none; padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .tab-btn.active { background: #0284c7; color: white; }
    .tab-btn.recent-tab { background: #7c3aed; color: white; }
    .add-sec-btn { background: #10b981; color: white; border: none; padding: 8px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap; }

    .container { max-width: 650px; margin: 0 auto; padding: 16px; }
    .btn-action { background: #0284c7; color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-bottom: 18px; }

    .card { background: #1e293b; border-radius: 12px; border: 1px solid #334155; padding: 16px; margin-bottom: 18px; }
    .card h2 { font-size: 1.1rem; color: #38bdf8; margin-bottom: 12px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.82rem; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 0.9rem; }
    .divider { text-align: center; margin: 12px 0; color: #64748b; font-size: 0.8rem; text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }

    .btn-submit { background: #10b981; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: 700; cursor: pointer; font-size: 0.95rem; }

    .lecture-card { background: #1e293b; border-radius: 12px; border: 1px solid #334155; margin-bottom: 18px; overflow: hidden; position: relative; }
    
    /* Video Box & Fullscreen Styling */
    .video-wrapper { position: relative; width: 100%; height: 220px; background: black; display: flex; align-items: center; justify-content: center; }
    .video-wrapper video, .video-wrapper iframe { width: 100%; height: 100%; border: none; }
    
    /* Fullscreen Touch Shield / Lock Overlay */
    .touch-lock-overlay { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.01); z-index: 999; }
    .touch-lock-overlay.locked { display: block; pointer-events: all; }
    .unlock-btn-badge { position: absolute; top: 20px; right: 20px; background: rgba(220, 38, 38, 0.9); color: white; padding: 8px 16px; border-radius: 30px; font-size: 0.85rem; font-weight: 700; border: 2px solid #fca5a5; z-index: 1000; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

    .video-toolbar { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #0f172a; border-bottom: 1px solid #334155; }
    .tool-btn { background: #334155; border: none; color: #e2e8f0; padding: 6px 12px; border-radius: 6px; font-size: 0.78rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .tool-btn.fullscreen-btn { background: #0284c7; color: white; }
    .tool-btn:active { opacity: 0.8; }

    .lec-body { padding: 14px; }
    .lec-body h3 { font-size: 1rem; margin-bottom: 6px; line-height: 1.35; }
    .lec-body p { font-size: 0.8rem; color: #94a3b8; margin-bottom: 8px; }

    /* Resume progress indicator */
    .progress-bar-wrap { width: 100%; height: 4px; background: #334155; border-radius: 2px; margin-bottom: 12px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: #38bdf8; width: 0%; }

    .badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; margin-left: 6px; }
    .badge-offline { background: #065f46; color: #34d399; }
    .badge-yt { background: #7f1d1d; color: #f87171; }
    .badge-online { background: #1e3a8a; color: #60a5fa; }

    .lec-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-pill { padding: 8px 12px; border-radius: 6px; font-size: 0.78rem; font-weight: 600; border: none; cursor: pointer; color: white; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
    .btn-edit { background: #0284c7; }
    .btn-dl { background: #10b981; }
    .btn-free-storage { background: #d97706; }
    .btn-pdf { background: #6366f1; }
    .btn-delete { background: #ef4444; }
    .empty-note { text-align: center; color: #64748b; padding: 40px 10px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <header>
    <h1>Lecture Hub APK</h1>
  </header>

  <div class="tabs-bar" id="tabsBar"></div>

  <div class="container">
    <button class="btn-action" onclick="toggleForm()">+ Add New Lecture</button>

    <div class="card" id="formCard" style="display: none;">
      <h2>Add Lecture</h2>
      
      <div class="form-group">
        <label>Subject</label>
        <select id="selSubject"></select>
      </div>

      <div class="form-group">
        <label>Lecture Title</label>
        <input type="text" id="lecTitle" placeholder="e.g. Modern History Part 1" />
      </div>

      <div class="form-group">
        <label>Duration</label>
        <input type="text" id="lecDuration" placeholder="e.g. 1h 45m" />
      </div>

      <div class="form-group">
        <label>📁 Option 1: Pick Video from Gallery (Offline Storage)</label>
        <input type="file" id="videoFile" accept="video/*" />
      </div>

      <div class="divider">— OR —</div>

      <div class="form-group">
        <label>🔗 Option 2: Paste YouTube / MP4 Link</label>
        <input type="text" id="videoUrl" placeholder="https://youtu.be/... or direct video link" />
      </div>

      <div class="form-group" style="margin-top: 18px; border-top: 1px dashed #334155; padding-top: 14px;">
        <label>📄 Lecture PDF Notes (from phone files)</label>
        <input type="file" id="pdfFile" accept="application/pdf" />
      </div>

      <button class="btn-submit" id="btnSave" onclick="saveLecture()">Save to Hub</button>
    </div>

    <div id="lectureList"></div>
  </div>

  <script>
    const DB_NAME = 'LectureAppStorageDB';
    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 2);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('files')) db.createObjectStore('files');
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function storeBlob(key, blob) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('files', 'readwrite');
        tx.objectStore('files').put(blob, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function fetchBlob(key) {
      try {
        const db = await openDB();
        return new Promise((resolve) => {
          const tx = db.transaction('files', 'readonly');
          const req = tx.objectStore('files').get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        });
      } catch (e) { return null; }
    }

    async function removeBlob(key) {
      try {
        const db = await openDB();
        const tx = db.transaction('files', 'readwrite');
        tx.objectStore('files').delete(key);
      } catch (e) {}
    }
const CLOUD_DATABASE_URL = 'https://raw.githubusercontent.com/tantrayfazu999-svg/lecture-apk/main/lectures.json';

let subjects = JSON.parse(localStorage.getItem('hub_subjects_v3')) || [
  "Bridge Course", "Ancient History", "Medieval History", "Modern History",
  "Post Independence", "World History", "Art and Culture", "Geography",
  "Environment and Ecology", "Indian Economy", "Indian Polity", "Governance",
  "Society, Social Issues, Social Justice", "International Relations",
  "Internal Security", "Disaster Management", "Science and Technology",
  "Ethics, Integrity and Aptitude", "Essay", "Starter Kit"
];
let lectures = JSON.parse(localStorage.getItem('hub_lectures_v3')) || [];
let playbackTimes = JSON.parse(localStorage.getItem('hub_playback_times')) || {};
let recentWatchIds = JSON.parse(localStorage.getItem('hub_recently_watched')) || [];
let currentSubject = 'Recently Watched';

// Automatically fetch from your GitHub cloud whenever the app opens
window.addEventListener('DOMContentLoaded', () => {
  autoFetchCloud();
});

async function autoFetchCloud() {
  try {
    const res = await fetch(CLOUD_DATABASE_URL + '?nocache=' + Date.now(), {
      cache: 'no-store'
    });
    if (!res.ok) return;
    const data = await res.json();

    if (data.subjects && Array.isArray(data.subjects) && data.subjects.length > 0) {
      subjects = data.subjects;
      localStorage.setItem('hub_subjects_v3', JSON.stringify(subjects));
    }

    if (data.lectures && Array.isArray(data.lectures) && data.lectures.length > 0) {
      // Overwrite local list with master GitHub cloud list to keep sequence & edits intact
      lectures = data.lectures;
      localStorage.setItem('hub_lectures_v3', JSON.stringify(lectures));
    }

    renderTabs();
    renderLectures();
  } catch (err) {
    console.log('Offline or using cached database.', err);
  }
}
    
    
    function renderTabs() {
      const bar = document.getElementById('tabsBar');
      bar.innerHTML = '';

      // Recently Watched Tab First
      const rBtn = document.createElement('button');
      rBtn.className = 'tab-btn recent-tab ' + (currentSubject === 'Recently Watched' ? 'active' : '');
      rBtn.innerText = '🕒 Recently Watched';
      rBtn.onclick = () => { currentSubject = 'Recently Watched'; renderTabs(); renderLectures(); };
      bar.appendChild(rBtn);

      // Subject Tabs
      subjects.forEach(s => {
        const b = document.createElement('button');
        b.className = 'tab-btn ' + (s === currentSubject ? 'active' : '');
        b.innerText = s;
        b.onclick = () => { currentSubject = s; renderTabs(); renderLectures(); };
        bar.appendChild(b);
      });

      const addB = document.createElement('button');
      addB.className = 'add-sec-btn';
      addB.innerText = '+ New Subject';
      addB.onclick = addSubject;
      bar.appendChild(addB);

      const sel = document.getElementById('selSubject');
      sel.innerHTML = '';
      subjects.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.innerText = s;
        sel.appendChild(opt);
      });
      if (subjects.includes(currentSubject)) sel.value = currentSubject;
    }

    function addSubject() {
      const name = prompt('Enter new subject name:');
      if (name && !subjects.includes(name.trim())) {
        subjects.push(name.trim());
        localStorage.setItem('hub_subjects_v3', JSON.stringify(subjects));
        currentSubject = name.trim();
        renderTabs();
        renderLectures();
      }
    }

    function toggleForm() {
      const c = document.getElementById('formCard');
      c.style.display = c.style.display === 'none' ? 'block' : 'none';
    }

    function extractYouTubeId(url) {
      if (!url) return null;
      const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|shorts\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      return match ? match[1] : null;
    }

    async function saveLecture() {
      const sub = document.getElementById('selSubject').value;
      const title = document.getElementById('lecTitle').value.trim();
      const dur = document.getElementById('lecDuration').value.trim() || '1h 30m';
      const videoFile = document.getElementById('videoFile').files[0];
      const videoUrl = document.getElementById('videoUrl').value.trim();
      const pdfFile = document.getElementById('pdfFile').files[0];

      if (!title) { alert('Please enter a lecture title'); return; }

      const id = 'lec_' + Date.now();
      const btn = document.getElementById('btnSave');
      btn.innerText = 'Saving...';
      btn.disabled = true;

      let hasPdf = false;
      if (pdfFile) {
        await storeBlob(id + '_pdf', pdfFile);
        hasPdf = true;
      }

      if (videoFile) {
        await storeBlob(id + '_video', videoFile);
        lectures.push({ id, subject: sub, title, duration: dur, type: 'file_offline', isDownloaded: true, url: '', ytId: null, hasPdf });
      } else if (videoUrl) {
        const ytId = extractYouTubeId(videoUrl);
        if (ytId) {
          lectures.push({ id, subject: sub, title, duration: dur, type: 'youtube', isDownloaded: false, url: videoUrl, ytId: ytId, hasPdf });
        } else {
          lectures.push({ id, subject: sub, title, duration: dur, type: 'direct_stream', isDownloaded: false, url: videoUrl, ytId: null, hasPdf });
        }
      } else {
        alert('Please choose a gallery video or paste a video link');
        btn.innerText = 'Save to Hub';
        btn.disabled = false;
        return;
      }

      localStorage.setItem('hub_lectures_v3', JSON.stringify(lectures));
      document.getElementById('lecTitle').value = '';
      document.getElementById('videoFile').value = '';
      document.getElementById('videoUrl').value = '';
      document.getElementById('pdfFile').value = '';
      toggleForm();
      btn.innerText = 'Save to Hub';
      btn.disabled = false;

      currentSubject = sub;
      renderTabs();
      renderLectures();
    }

    // --- Record Watch Progress & Recently Watched ---
    function recordWatch(id, currentTime, duration) {
      if (!recentWatchIds.includes(id)) {
        recentWatchIds.unshift(id);
      } else {
        recentWatchIds = recentWatchIds.filter(x => x !== id);
        recentWatchIds.unshift(id);
      }
      if (recentWatchIds.length > 20) recentWatchIds.pop();
      localStorage.setItem('hub_recently_watched', JSON.stringify(recentWatchIds));

      if (currentTime && duration) {
        playbackTimes[id] = { time: Math.floor(currentTime), total: Math.floor(duration) };
        localStorage.setItem('hub_playback_times', JSON.stringify(playbackTimes));
      }
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // --- Fullscreen Landscape + Lock Screen Integration ---
    function enterFullscreenLandscape(wrapperId, overlayId) {
      const wrap = document.getElementById(wrapperId);
      if (!wrap) return;

      if (!document.fullscreenElement) {
        if (wrap.requestFullscreen) {
          wrap.requestFullscreen();
        } else if (wrap.webkitRequestFullscreen) {
          wrap.webkitRequestFullscreen();
        }
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(() => {});
        }
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }
      }
    }

    function toggleLock(overlayId) {
      const overlay = document.getElementById(overlayId);
      if (!overlay) return;
      overlay.classList.toggle('locked');
    }

    function editLecture(id) {
      const item = lectures.find(l => l.id === id);
      if (!item) return;

      const newTitle = prompt('Edit Lecture Title:', item.title);
      if (newTitle === null) return;
      const finalTitle = newTitle.trim();
      if (!finalTitle) { alert('Title cannot be empty'); return; }

      const newDur = prompt('Edit Duration (e.g. 1h 45m):', item.duration);
      item.title = finalTitle;
      if (newDur !== null && newDur.trim()) item.duration = newDur.trim();

      localStorage.setItem('hub_lectures_v3', JSON.stringify(lectures));
      renderLectures();
    }

        // --- Universal Offline Downloader Engine ---
    async function downloadLecture(id, url) {
      const btn = document.getElementById('dl_btn_' + id);
      if (btn) btn.innerText = '⏳ Downloading...';

      // 1. If it's already an offline blob in phone memory, save file directly
      const localBlob = await fetchBlob(id + '_video');
      if (localBlob) {
        triggerNativeFileDownload(localBlob, `Lecture_${id}.mp4`);
        if (btn) btn.innerText = '✅ Saved to Files';
        return;
      }

      // 2. If it's a direct web link, fetch and save to device
      if (url && !url.includes('youtube.com') && !url.includes('youtu.be')) {
        try {
          const res = await fetch(url);
          const blob = await res.blob();
          await storeBlob(id + '_video', blob);

          const item = lectures.find(l => l.id === id);
          if (item) item.isDownloaded = true;
          localStorage.setItem('hub_lectures_v3', JSON.stringify(lectures));
          renderLectures();
          triggerNativeFileDownload(blob, `Lecture_${id}.mp4`);
          alert('Lecture downloaded and saved for offline viewing!');
        } catch (err) {
          window.open(url, '_system');
          if (btn) btn.innerText = '⬇️ Download';
        }
        return;
      }

      // 3. For YouTube lectures, send directly to stream downloader
      if (btn) btn.innerText = '⬇️ Download';
      openYouTubeDownloader(url);
    }

    // Direct stream grabber for YouTube lectures to save MP4 offline
    function openYouTubeDownloader(ytUrl) {
      if (!ytUrl) {
        alert('No link available to download.');
        return;
      }
      
      const match = ytUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|shorts\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      const videoId = match ? match[1] : '';

      if (videoId) {
        const downloadPortal = `https://y2mate.nu/en/youtube-to-mp4/${videoId}`;
        window.open(downloadPortal, '_blank');
      } else {
        window.open(ytUrl, '_blank');
      }
    }

    // Trigger Android Native File Download
    function triggerNativeFileDownload(blob, fileName) {
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
      }, 2000);
    }
    
    async function freeStorageOnly(id) {
      if (confirm('Delete offline file to free memory? (The lecture card will remain saved)')) {
        await removeBlob(id + '_video');
        const item = lectures.find(l => l.id === id);
        if (item) {
          item.isDownloaded = false;
          if (item.type === 'file_offline') item.type = 'file_cleared';
        }
        localStorage.setItem('hub_lectures_v3', JSON.stringify(lectures));
        renderLectures();
      }
    }

    async function deleteFullLecture(id) {
      if (confirm('Permanently delete this entire lecture and attached files?')) {
        await removeBlob(id + '_video');
        await removeBlob(id + '_pdf');
        lectures = lectures.filter(l => l.id !== id);
        recentWatchIds = recentWatchIds.filter(x => x !== id);
        delete playbackTimes[id];
        localStorage.setItem('hub_lectures_v3', JSON.stringify(lectures));
        localStorage.setItem('hub_recently_watched', JSON.stringify(recentWatchIds));
        localStorage.setItem('hub_playback_times', JSON.stringify(playbackTimes));
        renderLectures();
      }
    }

    async function openPdf(id) {
      const blob = await fetchBlob(id + '_pdf');
      if (blob) {
        window.open(URL.createObjectURL(blob), '_blank');
      } else {
        alert('PDF file not found in storage.');
      }
    }

    async function renderLectures() {
      const list = document.getElementById('lectureList');
      list.innerHTML = '';

      let items = [];
      if (currentSubject === 'Recently Watched') {
        items = recentWatchIds.map(id => lectures.find(l => l.id === id)).filter(Boolean);
      } else {
        items = lectures.filter(l => l.subject === currentSubject);
      }

      if (items.length === 0) {
        list.innerHTML = `<div class="empty-note">No lectures found in <strong>${currentSubject}</strong>.<br>Add one or start watching!</div>`;
        return;
      }

      for (const item of items) {
        const card = document.createElement('div');
        card.className = 'lecture-card';

        const wrapperId = 'wrap_' + item.id;
        const lockOverlayId = 'lock_' + item.id;
        const savedProgress = playbackTimes[item.id] || null;

        let playerHtml = '';
        let badgeHtml = '';

        if (item.isDownloaded) {
          const blob = await fetchBlob(item.id + '_video');
          playerHtml = blob 
            ? `<video id="vid_${item.id}" controls playsinline preload="metadata" src="${URL.createObjectURL(blob)}"></video>` 
            : `<div style="color:#ef4444;text-align:center;">Offline video missing.</div>`;
          badgeHtml = '<span class="badge badge-offline">Offline Saved</span>';
        } else if (item.type === 'youtube') {
          // If resumed timestamp exists, append start param &enablejsapi=1
          const startSec = savedProgress ? savedProgress.time : 0;
          playerHtml = `<iframe id="yt_${item.id}" src="https://www.youtube.com/embed/${item.ytId}?start=${startSec}&enablejsapi=1" allowfullscreen></iframe>`;
          badgeHtml = '<span class="badge badge-yt">YouTube</span>';
        } else if (item.type === 'file_cleared') {
          playerHtml = `<div style="color:#94a3b8;text-align:center;padding:20px;">Storage cleared. Re-upload video to watch.</div>`;
          badgeHtml = '<span class="badge badge-online">Cleared</span>';
        } else {
          playerHtml = `<video id="vid_${item.id}" controls playsinline preload="metadata" src="${item.url}"></video>`;
          badgeHtml = '<span class="badge badge-online">Online Stream</span>';
        }

        // Action Buttons
        let downloadActionBtn = '';
        if (item.isDownloaded) {
          downloadActionBtn = `<button class="btn-pill btn-free-storage" onclick="freeStorageOnly('${item.id}')">🗑️ Free Storage</button>`;
        } else if (item.type === 'youtube') {
          downloadActionBtn = `<button class="btn-pill btn-dl" onclick="openYouTubeDownloader('${item.url}')">⬇️ Download Video</button>`;
        } else if (item.url) {
          downloadActionBtn = `<button class="btn-pill btn-dl" id="dl_btn_${item.id}" onclick="downloadLecture('${item.id}', '${item.url}')">⬇️ Download for Offline</button>`;
        }

        const pdfBtn = item.hasPdf ? `<button class="btn-pill btn-pdf" onclick="openPdf('${item.id}')">📄 PDF Notes</button>` : '';

        // Progress calculation
        let progressWidth = 0;
        let progressNote = '';
        if (savedProgress && savedProgress.total > 0) {
          progressWidth = Math.min(100, (savedProgress.time / savedProgress.total) * 100);
          progressNote = ` • Stopped at ${formatTime(savedProgress.time)}`;
        }

        card.innerHTML = `
          <div class="video-toolbar">
            <button class="tool-btn fullscreen-btn" onclick="enterFullscreenLandscape('${wrapperId}', '${lockOverlayId}')">🔄 Rotate / Fullscreen</button>
            <button class="tool-btn" onclick="toggleLock('${lockOverlayId}')">🔒 Lock Screen</button>
          </div>

          <div class="video-wrapper" id="${wrapperId}">
            <div class="touch-lock-overlay" id="${lockOverlayId}">
              <div class="unlock-btn-badge" onclick="toggleLock('${lockOverlayId}')">🔓 Tap to Unlock</div>
            </div>
            ${playerHtml}
          </div>

          <div class="lec-body">
            <h3>${item.title}</h3>
            <p>Subject: ${item.subject} • Duration: ${item.duration} ${progressNote} ${badgeHtml}</p>
            <div class="progress-bar-wrap">
              <div class="progress-bar-fill" style="width: ${progressWidth}%;"></div>
            </div>
            <div class="lec-actions">
              <button class="btn-pill btn-edit" onclick="editLecture('${item.id}')">✏️ Edit Title</button>
              ${downloadActionBtn}
              ${pdfBtn}
              <button class="btn-pill btn-delete" onclick="deleteFullLecture('${item.id}')">Delete</button>
            </div>
          </div>
        `;
        list.appendChild(card);

        // Bind auto-resume listeners for HTML5 native video
        setTimeout(() => {
          const v = document.getElementById('vid_' + item.id);
          if (v) {
            if (savedProgress && savedProgress.time > 0) {
              v.currentTime = savedProgress.time;
            }
            v.addEventListener('play', () => recordWatch(item.id, v.currentTime, v.duration));
            v.addEventListener('timeupdate', () => {
              if (v.currentTime > 5) recordWatch(item.id, v.currentTime, v.duration);
            });
          }
        }, 100);
      }
    }

    renderTabs();
    renderLectures();
  </script>
</body>
</html>
